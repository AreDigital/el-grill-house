<style>
  body.pagina-404 { padding-bottom: 0; padding-right: 0 !important; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  .e404-icono .chispa { color: var(--gold); }

  .e404-btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; padding: 14px 38px; border: 2.5px solid var(--red); border-radius: 999px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background .18s, color .18s; }
  .e404-btn svg { transition: transform .18s; }
  @media (hover: hover) and (pointer: fine) {
    .e404-btn:hover { background: var(--red); color: #fff; }
    .e404-btn:hover svg { transform: translateX(4px); }
  }
